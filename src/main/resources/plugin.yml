name: nonscenes
author: utophii
main: com.nonxedy.Nonscenes
description: Plugin for creation cutscenes 1.20-1.21.11
version: 08-a
prefix: nonscenes
api-version: 1.20
load: POSTWORLD

depend: 
  - packetevents

softdepend:
  - LuckPerms

commands:
  nonscene:
    description: Main command for cutscene management
    aliases: [ns]
    usage: /nonscene <start|delete|all|play|showpath|stop|skip|pause|resume|rename|copy|export|import|event|edit|key|preview|save|discard|reload> [args]
    permission: nonscene.use

permissions:
  nonscene.use:
    description: Allows using the basic nonscene command
    default: op
  nonscene.start:
    description: Allows recording new cutscenes
    default: op
  nonscene.delete:
    description: Allows deleting cutscenes
    default: op
  nonscene.list:
    description: Allows listing all cutscenes
    default: op
  nonscene.play:
    description: Allows playing cutscenes
    default: op
  nonscene.play.others:
    description: Allows playing a cutscene for another player
    default: op
  nonscene.showpath:
    description: Allows visualizing cutscene paths
    default: op
  nonscene.stop:
    description: Allows cancelling recording/playback
    default: op
  nonscene.skip:
    description: Allows skipping your own cutscene (command or sneak)
    default: op
  nonscene.skip.others:
    description: Allows skipping another player's cutscene
    default: op
  nonscene.pause:
    description: Allows pausing and resuming your own cutscene
    default: op
  nonscene.pause.others:
    description: Allows pausing and resuming another player's cutscene
    default: op
  nonscene.rename:
    description: Allows renaming cutscenes
    default: op
  nonscene.copy:
    description: Allows copying cutscenes
    default: op
  nonscene.export:
    description: Allows exporting a cutscene to plugins/nonscenes/exports
    default: op
  nonscene.import:
    description: Allows importing a cutscene from plugins/nonscenes/exports
    default: op
  nonscene.event:
    description: Allows editing cutscene timeline events
    default: op
  nonscene.edit:
    description: Allows editing cutscene keyframes
    default: op
  nonscene.reload:
    description: Allows reloading config.yml, messages.yml and triggers
    default: op
  nonscene.admin:
    description: Grants all nonscene permissions
    default: op
    children:
      nonscene.use: true
      nonscene.start: true
      nonscene.delete: true
      nonscene.list: true
      nonscene.play: true
      nonscene.play.others: true
      nonscene.showpath: true
      nonscene.stop: true
      nonscene.skip: true
      nonscene.skip.others: true
      nonscene.pause: true
      nonscene.pause.others: true
      nonscene.rename: true
      nonscene.copy: true
      nonscene.export: true
      nonscene.import: true
      nonscene.event: true
      nonscene.edit: true
      nonscene.reload: true

# nonscenes configuration
# Schema version: 1

settings:
  # DEPRECATED: use cutscene.recording.capture-interval-ticks instead.
  # Kept for backward compatibility; will be removed in a future release.
  frames-per-second: 20

  # Countdown seconds before recording starts
  countdown-seconds: 3

  # Particle settings for path visualization
  path-visualization:
    # Particle type (REDSTONE, FLAME, END_ROD, etc.)
    particle: END_ROD
    # Duration in seconds to show the path
    duration: 30
    # Interval between particles (in blocks)
    spacing: 0.5

# ---------------------------------------------------------------------------
# Cutscene pipeline configuration
# ---------------------------------------------------------------------------
cutscene:
  playback:
    # Packet-based camera on a dedicated thread (20–240 Hz).
    # PacketEvents is required
    update-rate: 60

    # Camera height above the recorded feet position. 1.62 matches a standing
    # player's eyes. The camera is a client-side entity, the viewer cannot move
    # or look around and sees no hotbar or hand.
    eye-height: 1.62

    # Fade to black before the camera cuts in and before it cuts back.
    fade:
      # NONE      - hard cut.
      # BLINDNESS - works without a resource pack (blindness fog, eases out).
      # TITLE     - shows `title-glyph` as a title. Use a full-screen black glyph
      #             from your resource pack for a true smooth fade.
      mode: BLINDNESS
      out-ticks: 10   # fade to black
      hold-ticks: 10  # stay black while the camera switches
      in-ticks: 20    # fade back in
      # MiniMessage text, e.g. "<font:mypack:fade>\uE000</font>"
      title-glyph: ""

    # Both are timed splines through every keyframe: the camera passes each
    # keyframe at its own time and never stops at one.
    # CATMULL_ROM - round, flowing curves.
    # BEZIER      - tighter curves that never swing past a keyframe.
    interpolation: CATMULL_ROM

    # Sneaking skips the cutscene for viewers with nonscene.skip. Console and
    # player command events that have not fired yet still run.
    skip-on-sneak: true

    # Smooth rotation transitions (yaw/pitch wrapping handled automatically)
    smooth-rotation: true

  creation:
    progress-bar:
      enabled: true
      style: SOLID        # BossBar style: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
      color: BLUE         # BossBar color: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW

  recording:
    # How many server ticks pass between captured frames.
    # 1 = 20 FPS, 2 = 10 FPS, etc.
    capture-interval-ticks: 1

  editor:
    # When a raw recording is opened in the editor it is reduced to keyframes.
    # A frame is dropped when the path between the keyframes around it, at the
    # same moment in time, stays within these limits of it. Smaller values keep
    # more keyframes. `/nonscene edit <name> <blocks>` overrides the position one.
    simplify:
      position-tolerance: 0.25   # blocks
      angle-tolerance: 3.0       # degrees of yaw / pitch
    # Duration of a new segment when there is no neighbouring segment to copy
    # the speed from.
    default-segment-seconds: 2.0

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
triggers:
  first-join:
    enabled: false
    cutscene: intro
    delay-ticks: 40

  # Maps a custom command to a cutscene. Example: /intro plays "spawn_tour".
  commands: {}
  # intro: spawn_tour

  # Axis-aligned regions. Fires when a player walks in.
  regions: {}
  # spawn:
  #   world: world
  #   min-x: 0
  #   min-y: 64
  #   min-z: 0
  #   max-x: 20
  #   max-y: 90
  #   max-z: 20
  #   cutscene: spawn_intro
  #   once: true

# ---------------------------------------------------------------------------
# Storage configuration
# ---------------------------------------------------------------------------
storage:
  type: SQLITE

  sqlite:
    file-path: "cutscenes.db"

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: password
    table-prefix: nonscenes_
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  postgresql:
    host: localhost
    port: 5432
    database: minecraft
    username: postgres
    password: password
    schema: public
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mongodb:
    host: localhost
    port: 27017
    database: minecraft
    collection: cutscenes
    username: ""
    password: ""
    options:
      connect-timeout: 10000
      server-selection-timeout: 30000

  general:
    auto-create-tables: true
    max-retry-attempts: 3
    retry-delay: 5

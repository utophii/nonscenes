# nonscenes messages configuration

prefix: "&8[&#3498db&lnonscenes&8] &r"

# Command messages
player-only-command: "${prefix}&#e74c3cThis command can only be used by players."
no-permission: "${prefix}&#e74c3cYou don't have permission to use this command."
invalid-start-args: "${prefix}&#e74c3cUsage: /nonscene start <name> <seconds>"
invalid-play-args: "${prefix}&#e74c3cUsage: /nonscene play <name> [player]"
invalid-duration: "${prefix}&#e74c3cDuration must be a positive number of seconds (1–300)."
specify-cutscene-name: "${prefix}&#e74c3cPlease specify a cutscene name."
invalid-cutscene-name: "${prefix}&#e74c3cCutscene names may only contain letters, digits, underscore and hyphen."
player-not-online: "${prefix}&#e74c3cPlayer &#f39c12{player} &#e74c3cis not online."
error-occurred: "${prefix}&#e74c3cSomething went wrong. Check the server log."
config-reloaded: "${prefix}&#2ecc71Reloaded config.yml, messages.yml and triggers."
reload-failed: "${prefix}&#e74c3cReload failed, a config file is not valid YAML. The current config is kept, check the server log."
reload-storage-restart: "${prefix}&#f39c12Storage settings changed. Restart the server to use them."

# Recording messages
already-recording: "${prefix}&#e74c3cYou are already recording a cutscene."
cutscene-already-exists: "${prefix}&#e74c3cA cutscene with name &#f39c12{name} &#e74c3calready exists."
recording-countdown: "${prefix}&#f39c12Recording will start in &#e67e22{seconds} &#f39c12seconds..."
countdown: "${prefix}&#f39c12{seconds}..."
recording-started: "${prefix}&#2ecc71Started recording cutscene &#f39c12{name}&#2ecc71."
recording-cancelled: "${prefix}&#e74c3cRecording cancelled."
recording-progress: "${prefix}&#f39c12Recording frame &#e67e22{current}&#f39c12/&#e67e22{total}"
recording-finished: "${prefix}&#2ecc71Cutscene &#f39c12{name} &#2ecc71recorded successfully with &#e67e22{frames} &#2ecc71frames."

# Playback messages
cutscene-not-found: "${prefix}&#e74c3cCutscene &#f39c12{name} &#e74c3cnot found."
cutscene-playing: "${prefix}&#2ecc71Playing cutscene &#f39c12{name}&#2ecc71..."
playing-for-player: "${prefix}&#2ecc71Playing cutscene &#f39c12{name} &#2ecc71for &#f39c12{player}&#2ecc71."
playback-cancelled: "${prefix}&#e74c3cPlayback of cutscene &#f39c12{name} &#e74c3ccancelled."
cutscene-playback-finished: "${prefix}&#2ecc71Cutscene &#f39c12{name} &#2ecc71playback finished."
already-playing: "${prefix}&#e74c3cYou are already watching a cutscene."
invalid-playback-control-args: "${prefix}&#e74c3cUsage: /nonscene {action} <player>"
not-watching: "${prefix}&#e74c3c&#f39c12{player} &#e74c3cis not watching a cutscene."
playback-control-unavailable: "${prefix}&#e74c3cCan't {action} right now. Try again once the camera is moving."
playback-pause: "${prefix}&#f39c12Cutscene paused."
playback-resume: "${prefix}&#2ecc71Cutscene resumed."
playback-pause-other: "${prefix}&#f39c12Paused the cutscene for &#e67e22{player}&#f39c12."
playback-resume-other: "${prefix}&#2ecc71Resumed the cutscene for &#f39c12{player}&#2ecc71."
playback-skip-other: "${prefix}&#2ecc71Skipped the cutscene for &#f39c12{player}&#2ecc71."

# List messages
cutscene-list-header: "${prefix}&#f39c12Available cutscenes:"
cutscene-list-item: "${prefix}&7- &#3498db{name} &7(&#f39c12{frames} frames&7)"
no-cutscenes: "${prefix}&#e74c3cThere are no cutscenes available."

# Input blocking messages
command-disabled-during-cutscene: "${prefix}&#e74c3cCommands are disabled during cutscene playback."

# Delete messages
invalid-delete-args: "${prefix}&#e74c3cUsage: /nonscene delete <name>"
delete-confirm: "${prefix}&#f39c12Delete cutscene &#e67e22{name}&#f39c12? This cannot be undone. Run &#e67e22/nonscene delete {name} confirm &#f39c12within {seconds}s."
delete-confirm-button: "&#e74c3c&l[Confirm delete]"
cutscene-deleted: "${prefix}&#2ecc71Cutscene &#f39c12{name} &#2ecc71deleted successfully."

# Rename / copy / export / import messages
invalid-rename-args: "${prefix}&#e74c3cUsage: /nonscene rename <name> <new-name>"
invalid-copy-args: "${prefix}&#e74c3cUsage: /nonscene copy <name> <new-name>"
invalid-export-args: "${prefix}&#e74c3cUsage: /nonscene export <name>"
invalid-import-args: "${prefix}&#e74c3cUsage: /nonscene import <file> [new-name]"
cutscene-in-use: "${prefix}&#e74c3cCutscene &#f39c12{name} &#e74c3cis being played, recorded or edited right now."
cutscene-renamed: "${prefix}&#2ecc71Renamed &#f39c12{name} &#2ecc71to &#f39c12{new}&#2ecc71."
rename-trigger-warning: "${prefix}&#f39c12These triggers in config.yml still point at &#e67e22{name}&#f39c12: &7{triggers}"
cutscene-copied: "${prefix}&#2ecc71Copied &#f39c12{name} &#2ecc71to &#f39c12{new}&#2ecc71."
cutscene-exported: "${prefix}&#2ecc71Exported &#f39c12{name} &#2ecc71to &#f39c12{file}&#2ecc71."
cutscene-imported: "${prefix}&#2ecc71Imported &#f39c12{name} &#2ecc71(&#e67e22{frames} &#2ecc71frames)."
import-file-not-found: "${prefix}&#e74c3cNo file &#f39c12{file}.yml &#e74c3cin plugins/nonscenes/exports."
import-invalid-file: "${prefix}&#e74c3c&#f39c12{file} &#e74c3cis not a valid cutscene file."
import-world-missing: "${prefix}&#f39c12World &#e67e22{world} &#f39c12is not loaded. The cutscene plays once it is."

# Path visualization messages
showing-path: "${prefix}&#2ecc71Showing path for cutscene &#f39c12{name} &#2ecc71for &#e67e22{duration} &#2ecc71seconds."
path-visualization-cancelled: "${prefix}&#e74c3cPath visualization cancelled."
path-already-showing: "${prefix}&#e74c3cYou are already visualizing a cutscene path."

# Stop command messages
nothing-to-cancel: "${prefix}&#e74c3cYou have no active recording, playback, or path visualization to cancel."

# Timeline event messages
invalid-event-args: "${prefix}&#e74c3cUsage: /nonscene event <add|list|clear> <name> [type] [seconds] [data]"
invalid-event-type: "${prefix}&#e74c3cType must be title, sound, particle, console, or player."
invalid-event-time: "${prefix}&#e74c3cTime must be a number of seconds (0 or more)."
event-added: "${prefix}&#2ecc71Added &#f39c12{type} &#2ecc71event at &#e67e22{seconds}s &#2ecc71to &#f39c12{name}&#2ecc71."
event-cleared: "${prefix}&#2ecc71Cleared timeline events for &#f39c12{name}&#2ecc71."
event-list-header: "${prefix}&#f39c12Events for &#e67e22{name}&#f39c12:"
event-list-item: "${prefix}&7#{index} &#3498db{seconds}s &#f39c12{type} &7{data}"
event-list-empty: "${prefix}&#e74c3cCutscene &#f39c12{name} &#e74c3chas no timeline events."

# Keyframe editor messages
invalid-edit-args: "${prefix}&#e74c3cUsage: /nonscene edit <name> [tolerance-in-blocks]"
invalid-key-args: "${prefix}&#e74c3cUsage: /nonscene key <add [#]|remove <#>|move <#>|speed <#> <seconds>|tp <#>|list>"
editor-not-open: "${prefix}&#e74c3cYou are not editing a cutscene. Use /nonscene edit <name>."
editor-already-open: "${prefix}&#e74c3cYou are already editing &#f39c12{name}&#e74c3c. Save or discard it first."
editor-in-use: "${prefix}&#e74c3c&#f39c12{player} &#e74c3cis already editing &#f39c12{name}&#e74c3c."
editor-opened: "${prefix}&#2ecc71Editing &#f39c12{name} &#2ecc71(&#e67e22{keyframes} &#2ecc71keyframes)."
editor-opened-new: "${prefix}&#2ecc71Started a new cutscene &#f39c12{name}&#2ecc71. Add keyframes with /nonscene key add."
editor-simplified: "${prefix}&#2ecc71Editing &#f39c12{name}&#2ecc71: reduced &#e67e22{frames} &#2ecc71recorded frames to &#e67e22{keyframes} &#2ecc71keyframes."
editor-need-two: "${prefix}&#e74c3cA cutscene needs at least 2 keyframes."
editor-saved: "${prefix}&#2ecc71Saved &#f39c12{name} &#2ecc71(&#e67e22{keyframes} &#2ecc71keyframes, &#e67e22{seconds}s&#2ecc71)."
editor-events-after-end: "${prefix}&#f39c12{count} timeline event(s) are after the end ({seconds}s) and will not fire."
editor-discarded: "${prefix}&#e74c3cDiscarded changes to &#f39c12{name}&#e74c3c."
editor-invalid-index: "${prefix}&#e74c3cKeyframe number must be between 1 and {max}."
editor-invalid-segment: "${prefix}&#e74c3cSegment number must be between 1 and {max} (segment N goes from keyframe N to N+1)."
editor-invalid-duration: "${prefix}&#e74c3cDuration must be between 0.05 and 600 seconds."
editor-world-missing: "${prefix}&#e74c3cWorld &#f39c12{world} &#e74c3cis not loaded."
editor-key-added: "${prefix}&#2ecc71Added keyframe &#e67e22#{index} &#2ecc71at your position (&#e67e22{keyframes} &#2ecc71total)."
editor-key-removed: "${prefix}&#2ecc71Removed keyframe &#e67e22#{index} &#2ecc71(&#e67e22{keyframes} &#2ecc71left)."
editor-key-moved: "${prefix}&#2ecc71Moved keyframe &#e67e22#{index} &#2ecc71to your position and view."
editor-key-teleported: "${prefix}&#2ecc71You are at keyframe &#e67e22#{index}&#2ecc71. Your view is the camera's view."
editor-segment-set: "${prefix}&#2ecc71#{from} → #{to} now takes &#e67e22{seconds}s &#2ecc71(total &#e67e22{total}s&#2ecc71)."
editor-list-header: "${prefix}&#f39c12{name}&7: &#e67e22{keyframes} &7keyframes, &#e67e22{seconds}s"
editor-list-item: "${prefix}&7#{index} &#3498db{time}s &7{world} {x} {y} {z} &7→ &#f39c12{segment}"
editor-help:
  - "&8&m-----&r &#3498db&lKeyframe editor &8&m-----"
  - "&#3498db/ns key add [#] &7- Add a keyframe at your position and view"
  - "&#3498db/ns key move <#> &7- Move a keyframe to your position and view"
  - "&#3498db/ns key remove <#> &7- Remove a keyframe"
  - "&#3498db/ns key speed <#> <seconds> &7- Time from keyframe # to the next"
  - "&#3498db/ns key tp <#> &7- Go to a keyframe / &#3498db/ns key list"
  - "&#3498db/ns preview &7- Watch the draft / &#3498db/ns save &7/ &#3498db/ns discard"
  - "&7Dots are 0.1s apart: denser dots mean a slower camera."

# Help messages
help-messages:
  - "&8&m-----&r &#3498db&lNonScenes Commands &8&m-----"
  - "&#3498db/nonscene start <name> <seconds> &7- Start recording a cutscene"
  - "&#3498db/nonscene stop &7- Cancel recording/playback"
  - "&#3498db/nonscene delete <name> &7- Delete a cutscene"
  - "&#3498db/nonscene all &7- List all cutscenes"
  - "&#3498db/nonscene play <name> [player] &7- Play a cutscene"
  - "&#3498db/nonscene skip|pause|resume [player] &7- Control playback (sneak skips too)"
  - "&#3498db/nonscene rename|copy <name> <new-name> &7- Rename or copy a cutscene"
  - "&#3498db/nonscene export <name> &7/ &#3498dbimport <file> [new-name] &7- Share via exports/"
  - "&#3498db/nonscene event add <name> <type> <seconds> <data> &7- Add a timeline event"
  - "&#3498db/nonscene showpath <name> &7- Visualize cutscene path"
  - "&#3498db/nonscene edit <name> &7- Edit keyframes (creates the cutscene if new)"
  - "&#3498db/nonscene reload &7- Reload config, messages and triggers"
  - "&8&m------------------------------"
